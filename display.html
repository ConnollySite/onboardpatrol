<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="On Duty">
<title>BVN Connolly - On Duty</title>
<meta name="theme-color" content="#0a1633">
<style>
  :root { --rh: 60px; --blue1: #1b4fd8; --blue2: #1643bd; --head: #1238a6; --yel: #f5d547; --ink: #ffffff; --soft: #bcd0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060d22; color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; padding: 1.2vh 1.2vw; gap: 0; }
  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--head); border: 2px solid #3f6be0; box-shadow: 0 0 40px rgba(20,60,200,.35); }
  /* header like a station departure board */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 1.2vh 1.6vw .6vh; background: linear-gradient(180deg, #1a47c6, #1238a6); }
  .ttl { display: flex; align-items: baseline; gap: 2vw; }
  .ttl h1 { margin: 0; font-size: 7vh; font-weight: 500; color: var(--yel); letter-spacing: .01em; line-height: 1; }
  .ttl em { font-size: 6vh; color: var(--yel); }
  .clock { font-size: 7.6vh; font-weight: 400; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  .brand { text-align: right; line-height: 1.05; }
  .brand b { display: block; font-size: 5vh; letter-spacing: .06em; }
  .brand span { display: block; font-size: 2vh; font-weight: 700; letter-spacing: .3em; }
  .brand i { display: block; font-size: 2.3vh; color: var(--soft); margin-top: .4vh; font-style: normal; }
  .cols, .row { display: grid; grid-template-columns: 9fr 8fr 19fr 19fr 45fr; align-items: center; column-gap: 1vw; padding: 0 1.6vw; }
  .cols { padding-top: .6vh; padding-bottom: .9vh; font-size: 2.5vh; color: var(--ink); line-height: 1.15; border-bottom: 1px solid rgba(255,255,255,.12); background: linear-gradient(180deg, #1238a6, #1546c9); }
  .cols i { display: block; color: var(--ink); opacity: .9; }
  #rows { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .row { flex: 1 1 0; min-height: 0; max-height: 13vh; background: var(--blue1); }
  .row:nth-child(even) { background: var(--blue2); }
  .tm { font-size: calc(var(--rh) * .46); font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .tm small { display: block; font-size: .5em; color: var(--yel); margin-top: .15em; }
  .box { display: inline-block; background: #fff; color: #d6211f; font-weight: 800; font-size: calc(var(--rh) * .34); letter-spacing: .06em; padding: .18em .45em; border-radius: 3px; line-height: 1.1; text-transform: uppercase; min-width: 3.1em; text-align: center; }
  .tn { display: block; font-size: calc(var(--rh) * .18); color: var(--soft); margin-top: .25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm { font-size: calc(var(--rh) * .42); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .nm small { display: block; font-size: .55em; color: var(--yel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm.none { color: rgba(255,255,255,.45); }
  .info { overflow: hidden; white-space: nowrap; position: relative; height: 100%; display: flex; align-items: center; mask-image: linear-gradient(90deg, transparent 0, #000 2%, #000 98%, transparent 100%); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 2%, #000 98%, transparent 100%); }
  .info span { display: inline-block; font-size: calc(var(--rh) * .36); will-change: transform; }
  .info .cu { color: var(--yel); font-weight: 700; }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 4vh; color: var(--soft); text-align: center; padding: 4vh; background: var(--blue1); }
  .empty small { font-size: 2.4vh; margin-top: 1.5vh; max-width: 70vw; }
  /* bottom announcements line */
  #ticker { display: none; overflow: hidden; white-space: nowrap; background: #0b1f63; border-top: 2px solid var(--yel); }
  #ticker.on { display: block; }
  #tk { display: inline-block; padding: .8vh 0; font-size: 3.8vh; color: var(--yel); font-weight: 700; will-change: transform; }
  footer { display: flex; justify-content: space-between; align-items: center; color: #8ea7e6; font-size: 1.6vh; padding-top: .7vh; }
  .dot { display: inline-block; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: #4ade80; margin-right: .5vw; vertical-align: middle; }
  .dot.bad { background: #f87171; }
  footer button { background: transparent; color: #8ea7e6; border: 1px solid #2c4aa0; padding: .4vh .9vw; font: inherit; cursor: pointer; border-radius: 4px; }
  #pop { display: none; position: fixed; inset: 6vh 5vw; z-index: 15; background: #0b1f63; border: 4px solid var(--yel); box-shadow: 0 0 0 100vmax rgba(0,0,0,.75); flex-direction: column; align-items: center; justify-content: center; padding: 4vh 4vw; text-align: center; }
  #pop.on { display: flex; }
  #popLabel { font-size: 3vh; letter-spacing: .3em; color: var(--yel); text-transform: uppercase; margin-bottom: 3vh; font-weight: 700; }
  #popText { font-weight: 700; line-height: 1.15; color: #fff; max-width: 100%; overflow-wrap: anywhere; }
  /* phone (QR code): one card per team, the page scrolls */
  @media (max-width: 800px) {
    html, body { height: auto; overflow: auto; }
    #app { height: auto; min-height: 100vh; padding: 8px; }
    header { grid-template-columns: 1fr auto; row-gap: 4px; padding: 10px 12px 6px; }
    .ttl h1 { font-size: 30px; } .ttl em { display: none; }
    .clock { font-size: 26px; text-align: right; }
    .brand { display: none; }
    .cols { display: none; }
    #rows { display: block; }
    .row { --rh: 64px; max-height: none; grid-template-columns: auto auto 1fr; grid-template-areas: "tm box box" "n1 n1 n1" "n2 n2 n2" "info info info"; row-gap: 6px; padding: 10px 12px; }
    .tm { grid-area: tm; } .bx { grid-area: box; } .n1 { grid-area: n1; } .n2 { grid-area: n2; } .info { grid-area: info; height: 30px; } .info span { font-size: 18px; }
    .info:empty, .info span:empty { display: none; }
    .nm { white-space: normal; }
    #tk { font-size: 20px; }
    footer { font-size: 12px; padding: 8px 2px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="board">
    <header>
      <div class="ttl"><h1>On Duty</h1><em>Connolly</em></div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="brand"><b>BVN</b><span>BIDVEST NOONAN</span><i id="day"></i></div>
    </header>
    <div class="cols">
      <div>Shift<i>time</i></div><div>Team<i>post</i></div><div>Officer 1<i>phone · bodycam 1</i></div><div>Officer 2<i>key · bodycam 2</i></div><div>Information<i>messages · patrol now</i></div>
    </div>
    <div id="rows"></div>
    <div id="ticker"><div id="tk"></div></div>
  </div>
  <footer><span><span class="dot" id="dot"></span><span id="status">Loading...</span></span><span><button id="fs">Full screen</button></span></footer>
</div>
<div id="pop"><div id="popLabel">Announcement</div><div id="popText"></div></div>
<script>
(function () {
  // Onboard Patrol backend (public feeds only: no PIN on this screen)
  var URL_ = 'https://script.google.com/macros/s/AKfycbzyF9G_x34LnFZwufDixy3yff7WdMxnVlfeohSYnmlN8Dg025mdryAWMy1K-z0UA6dPTw/exec';
  var REFRESH_MS = 60000;
  var $ = function (id) { return document.getElementById(id); };
  var data = null, lastOk = 0, staticSig = '', infoAnims = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function getJSON(q) { return fetch(URL_ + '?' + q + '&t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }); }

  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Europe/Dublin' });
    var shown = data && data.date ? new Date(data.date + 'T12:00:00Z') : d;
    $('day').textContent = shown.toLocaleDateString('en-IE', { weekday: 'short', day: '2-digit', month: 'short', timeZone: data && data.date ? 'UTC' : 'Europe/Dublin' });
  }
  setInterval(tick, 1000); tick();

  // "16:30 - 00:30" -> start and end
  function shiftParts(t) {
    var m = String(t || '').match(/(\d{1,2})[:.h](\d{2})/g) || [];
    var fix = function (x) { var p = x.split(/[:.h]/); return ('0' + p[0]).slice(-2) + ':' + p[1]; };
    return { start: m[0] ? fix(m[0]) : '', end: m[1] ? fix(m[1]) : '' };
  }
  function initials(s) { var w = String(s || '').replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/); return (w.length > 1 ? w.map(function (x) { return x[0]; }).join('') : (w[0] || '').slice(0, 3)).slice(0, 4).toUpperCase(); }

  // one line per team that has crew today, in the order of the dashboard Teams list; other posts (e.g. supervisor) at the end
  function buildRows() {
    var rows = (data && data.rows) || [], teams = (data && data.teams) || [], out = [], used = {};
    teams.forEach(function (t) {
      var mine = rows.filter(function (r) { return norm(r.team) === norm(t.code); });
      if (!mine.length) return;
      var ppl = [], time = '';
      mine.forEach(function (r) {
        used[r.post + '|' + r.team] = true;
        if (!time && r.time) time = r.time;
        (r.names || []).forEach(function (n, k) {
          var note = (r.notes && r.notes[k]) || '';
          var f = ppl.filter(function (x) { return x.name === n; })[0];
          if (f) { if (!f.note && note) f.note = note; } else ppl.push({ name: n, note: note });
        });
      });
      out.push({ key: t.code, code: t.code, name: t.name, time: time, ppl: ppl, line: (data.lines || {})[t.code] || '', plan: (data.plans || {})[t.code] || '' });
    });
    rows.filter(function (r) { return !used[r.post + '|' + r.team] && (r.names || []).length; }).forEach(function (r) {
      out.push({ key: 'post:' + r.post, code: /supervisor/i.test(r.post) ? 'SUP' : initials(r.post), name: r.post, time: r.time || '', ppl: r.names.map(function (n, k) { return { name: n, note: (r.notes && r.notes[k]) || '' }; }), line: '', plan: '' });
    });
    return out;
  }
  function personHtml(p, extra) {
    if (!p) return '<div class="nm none">&mdash;</div>';
    var sub = [p.note, extra].filter(Boolean).join(' · ');
    return '<div class="nm">' + esc(p.name) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';
  }
  function infoHtml(r) {
    var parts = [];
    if (r.line) parts.push('<b class="cu">' + esc(r.line) + '</b>');
    if (r.plan) parts.push(esc(r.plan));
    return parts.join('&nbsp;&nbsp;&nbsp;&#9670;&nbsp;&nbsp;&nbsp;');
  }
  function render() {
    var list = buildRows(), box = $('rows');
    if (!list.length) {
      staticSig = '';
      box.innerHTML = '<div class="empty">No crew received from the Duty Roster for today<small>In the Duty Roster open today, press "Mark day as ready" and wait a minute. The names appear here automatically.</small></div>';
      return;
    }
    var sig = JSON.stringify(list.map(function (r) { return [r.key, r.code, r.name, r.time, r.ppl]; }));
    if (sig !== staticSig) {
      staticSig = sig; infoAnims = {};
      box.innerHTML = list.map(function (r) {
        var sp = shiftParts(r.time), extra = r.ppl.slice(2).map(function (p) { return p.name; }).join(', ');
        return '<div class="row" data-k="' + esc(r.key) + '">' +
          '<div class="tm">' + (sp.start ? esc(sp.start) + (sp.end ? '<small>&rarr; ' + esc(sp.end) + '</small>' : '') : '&mdash;') + '</div>' +
          '<div class="bx"><span class="box">' + esc(r.code) + '</span><span class="tn">' + esc(r.name) + '</span></div>' +
          '<div class="n1">' + personHtml(r.ppl[0]) + '</div>' +
          '<div class="n2">' + personHtml(r.ppl[1], extra ? '+ ' + extra : '') + '</div>' +
          '<div class="info"><span></span></div></div>';
      }).join('');
      fitRows();
    }
    // the scrolling information: only restarted when its text changes
    list.forEach(function (r) {
      var row = box.querySelector('.row[data-k="' + (window.CSS && CSS.escape ? CSS.escape(r.key) : r.key) + '"]'); if (!row) return;
      var html = infoHtml(r), span = row.querySelector('.info span');
      if (infoAnims[r.key] && infoAnims[r.key].html === html) return;
      if (infoAnims[r.key] && infoAnims[r.key].anim) infoAnims[r.key].anim.cancel();
      span.innerHTML = html;
      infoAnims[r.key] = { html: html, anim: scroll(span, row.querySelector('.info')) };
    });
  }
  // right to left, continuous, same speed on every line
  function scroll(span, cell) {
    if (!span.textContent || !span.animate) return null;
    var w = span.scrollWidth, cw = cell.clientWidth, speed = Math.max(60, cw / 9);
    return span.animate([{ transform: 'translateX(' + cw + 'px)' }, { transform: 'translateX(' + (-w) + 'px)' }], { duration: (w + cw) / speed * 1000, iterations: Infinity });
  }
  // every line gets the same height; text size follows the line height
  function fitRows() {
    var box = $('rows'), n = box.querySelectorAll('.row').length || 1;
    var narrow = window.matchMedia && window.matchMedia('(max-width: 800px)').matches;
    if (narrow) { document.documentElement.style.removeProperty('--rh'); return; }
    var h = Math.min(box.clientHeight / n, window.innerHeight * 0.13);
    document.documentElement.style.setProperty('--rh', Math.max(18, Math.floor(h)) + 'px');
  }
  window.addEventListener('resize', function () { fitRows(); staticSig = ''; render(); });

  function setStatus(ok, msg) { $('dot').className = 'dot' + (ok ? '' : ' bad'); $('status').textContent = msg; }
  function load() {
    getJSON('format=board').then(function (r) {
      if (!r || !Array.isArray(r.rows) || !Array.isArray(r.teams)) throw new Error('bad');
      data = r; lastOk = Date.now(); tick(); render();
      setStatus(true, 'Updated ' + new Date().toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Dublin' }) + ' · refreshes every minute');
    }).catch(function () {
      setStatus(false, lastOk ? 'No connection - showing the last update (' + new Date(lastOk).toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit' }) + ')' : 'No connection');
    });
  }
  load();
  setInterval(load, REFRESH_MS);

  /* ---- Full screen (iPhone: hides the bottom bar instead) ---- */
  $('fs').onclick = function () {
    var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (rq) { try { var p = rq.call(el); if (p && p.catch) p.catch(function () { cleanMode(); }); return; } catch (e) {} }
    cleanMode();
  };
  function cleanMode() {
    var f = document.querySelector('footer'); f.style.display = 'none'; fitRows();
    setTimeout(function () { document.addEventListener('click', function () { f.style.display = ''; fitRows(); }, { once: true }); }, 300);
  }

  /* ---- Announcements (public feed): bottom line + full-screen pop-up ---- */
  var annSig = '', tickAnim = null, pops = [], popIdx = 0, popT = null, popSig = '', annLast = [];
  function showTicker(texts) {
    var box = $('ticker'), tk = $('tk');
    if (!texts.length) { if (tickAnim) tickAnim.cancel(); tickAnim = null; box.classList.remove('on'); tk.textContent = ''; fitRows(); return; }
    box.classList.add('on'); tk.textContent = texts.join('      ◆      '); fitRows();
    if (tickAnim) tickAnim.cancel();
    if (!tk.animate) return;
    var w = tk.scrollWidth, cw = box.clientWidth, speed = Math.max(90, cw / 14);
    tickAnim = tk.animate([{ transform: 'translateX(' + cw + 'px)' }, { transform: 'translateX(' + (-w) + 'px)' }], { duration: (w + cw) / speed * 1000, iterations: Infinity });
  }
  function fitPop() {
    var t = $('popText'), box = $('pop'), fs = Math.round(window.innerHeight * 0.18);
    t.style.fontSize = fs + 'px';
    while (fs > 14 && (t.scrollHeight > box.clientHeight * 0.72 || t.scrollWidth > box.clientWidth * 0.94)) { fs = Math.round(fs * 0.93); t.style.fontSize = fs + 'px'; }
  }
  function popCycle() {
    clearTimeout(popT);
    if (!pops.length) { $('pop').classList.remove('on'); return; }
    var it = pops[popIdx % pops.length];
    $('popText').textContent = it.text; $('pop').classList.add('on'); fitPop();
    if (pops.length === 1 && !it.gapSec) return;
    popT = setTimeout(function () { $('pop').classList.remove('on'); popIdx++; popT = setTimeout(popCycle, Math.max(0, it.gapSec || 0) * 1000); }, Math.max(3, it.showSec || 15) * 1000);
  }
  function applyAnnouncements(items) {
    var ticks = items.filter(function (a) { return a.mode !== 'popup'; }), pp = items.filter(function (a) { return a.mode === 'popup'; });
    var ts = JSON.stringify(ticks.map(function (a) { return a.text; }));
    if (ts !== annSig) { annSig = ts; showTicker(ticks.map(function (a) { return a.text; })); }
    var ps = JSON.stringify(pp.map(function (a) { return [a.id, a.text, a.showSec, a.gapSec]; }));
    if (ps !== popSig) { popSig = ps; pops = pp; popIdx = 0; popCycle(); }
  }
  function loadAnn() { getJSON('format=announcements').then(function (r) { if (r && Array.isArray(r.items)) { annLast = r.items; applyAnnouncements(annLast); } }).catch(function () {}); }
  setInterval(loadAnn, 30000);
  window.addEventListener('resize', function () { if ($('pop').classList.contains('on')) fitPop(); annSig = ''; applyAnnouncements(annLast); });
  loadAnn();
  window.__display = { load: load, render: render, loadAnn: loadAnn };
})();
</script>
</body>
</html>
